<style>
/* Layout: one phone-width app column, centered on larger screens; sticky top bar, bottom tab bar, sheets slide up from the bottom. Black and brass, after the club's own concept. */
:root {
  --bg: #070707;
  --ground: #0D0C0B;
  --surface: #171512;
  --surface-2: #221F1A;
  --line: #2E2A23;
  --fg: #F3EFE6;
  --fg-2: #CFC8BA;
  --muted: #9D9585;
  --gold: #D6B36A;
  --gold-2: #F0D69A;
  --gold-deep: #9C7A36;
  --gold-bg: #1F190E;
  --gold-line: #3D3120;
  --box: #E0B860;
  --func: #8CC97A;
  --fit: #84B6E8;
  --boot: #EE9562;
  --rec: #B3A3EE;
  --ok: #8CC97A;
  --ok-bg: #142116;
  --warn: #F0A85C;
  --warn-bg: #251A0D;
  --bad: #F08B86;
  --bad-bg: #281516;
  --on-light: #0D0C0B;
  --logo: "Cinzel", "Trajan Pro", Georgia, serif;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; -webkit-font-smoothing: antialiased; }
button, input, select { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.app { max-width: 440px; margin: 0 auto; min-height: 100%; background: var(--ground); display: flex; flex-direction: column; position: relative; box-shadow: 0 0 0 1px var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ground); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--ground); border-bottom: 1px solid var(--surface-2); padding-block: 12px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.logo { font-family: var(--logo); font-weight: 700; font-size: 23px; letter-spacing: .06em; line-height: 1; text-transform: uppercase; background: linear-gradient(180deg, var(--gold-2), var(--gold) 55%, var(--gold-deep)); -webkit-background-clip: text; background-clip: text; color: var(--gold); -webkit-text-fill-color: transparent; }
.sub { font-size: 10px; color: var(--gold); letter-spacing: .32em; text-transform: uppercase; font-weight: 700; }
.rolebtn { min-height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 6px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; font-weight: 700; white-space: nowrap; }
.av { width: 30px; height: 30px; border-radius: 15px; background: var(--surface-2); display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 12px; flex: 0 0 auto; }
.rolebtn .av { background: var(--gold); color: var(--on-light); }
main { flex: 1 1 auto; padding-block: 18px 110px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px; }
h1 { font-family: var(--display); font-weight: 700; font-size: 32px; line-height: 1; margin: 0; text-wrap: balance; letter-spacing: .01em; }
.lead { font-size: 13px; color: var(--muted); margin-top: 6px; }
.eyebrow { font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; align-items: center; gap: 12px; }
.grow { flex: 1 1 auto; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.stack-s { display: flex; flex-direction: column; gap: 8px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.title { font-weight: 700; font-size: 15px; }
.meta { font-size: 13px; color: var(--muted); }
.small { font-size: 12px; color: var(--fg-2); }
.btn { min-height: 44px; padding: 0 18px; border-radius: 22px; border: none; background: var(--fg); color: var(--on-light); font-weight: 800; font-size: 13px; flex: 0 0 auto; }
.btn.accent { background: linear-gradient(180deg, var(--gold-2), var(--gold)); color: var(--on-light); }
.btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--fg); }
.btn.okline { background: transparent; border: 1px solid var(--ok); color: var(--ok); }
.btn.warnline { background: transparent; border: 1px solid var(--warn); color: var(--warn); }
.btn.big { min-height: 52px; border-radius: 26px; font-size: 15px; width: 100%; }
.btn:disabled { opacity: .45; cursor: default; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { min-height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid var(--line); background: var(--surface); color: var(--fg-2); font-weight: 700; font-size: 13px; white-space: nowrap; flex: 0 0 auto; }
.chip[aria-pressed="true"] { background: var(--gold); color: var(--on-light); border-color: var(--gold); }
.day { min-width: 50px; height: 64px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--fg-2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; flex: 0 0 auto; }
.day b { font-family: var(--display); font-size: 23px; line-height: 1; }
.day small { font-size: 12px; font-weight: 700; }
.day[aria-pressed="true"] { background: var(--gold); color: var(--on-light); border-color: var(--gold); }
.sess { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
.sess.off { opacity: .5; }
.stripe { width: 5px; align-self: stretch; border-radius: 3px; flex: 0 0 auto; }
.type { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
.badge { font-size: 11px; font-weight: 800; border-radius: 10px; padding: 3px 9px; color: var(--on-light); white-space: nowrap; flex: 0 0 auto; }
.b-ok { background: var(--ok); } .b-warn { background: var(--warn); } .b-bad { background: var(--bad); } .b-info { background: var(--fit); } .b-muted { background: var(--surface-2); color: var(--fg-2); }
.stat { border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 4px; border: 1px solid var(--line); background: var(--surface); text-align: left; color: var(--fg); }
.stat b { font-family: var(--display); font-weight: 800; font-size: 32px; line-height: 1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--fg-2); }
.t-gold { background: var(--gold-bg); border-color: var(--gold-line); } .t-gold b { color: var(--gold); }
.t-warn { background: var(--warn-bg); border-color: #43301A; } .t-warn b { color: var(--warn); }
.quick { min-height: 86px; border-radius: 16px; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; padding: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font-weight: 700; font-size: 13px; text-align: left; }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 2px 14px; display: flex; flex-direction: column; }
.li { min-height: 56px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--surface-2); padding-block: 8px; }
.li:last-child { border-bottom: none; }
.person { width: 100%; min-height: 58px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); display: flex; align-items: center; gap: 12px; padding: 8px 12px; text-align: left; }
.tick { width: 30px; height: 30px; border-radius: 15px; border: 2px solid #4A4438; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; }
.tick.on { background: var(--ok); border-color: var(--ok); color: var(--on-light); }
.bar { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 4px; }
.kv { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
.kv span:first-child { color: var(--muted); }
.amount { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tabs { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 440px; z-index: 6; background: rgba(9, 8, 7, .96); backdrop-filter: blur(10px); border-top: 1px solid var(--surface-2); display: grid; padding-top: 6px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); padding-left: max(4px, env(safe-area-inset-left, 0px)); padding-right: max(4px, env(safe-area-inset-right, 0px)); }
.tab { min-height: 52px; background: transparent; border: none; color: #8C8577; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 800; }
.tab[aria-current="page"] { color: var(--gold); }
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(3, 3, 2, .74); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 440px; max-height: 88vh; overflow-y: auto; background: #13110E; border-top: 1px solid var(--gold-line); border-radius: 24px 24px 0 0; padding-top: 20px; padding-bottom: calc(26px + env(safe-area-inset-bottom, 0px)); padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; animation: up .22s ease-out; }
@keyframes up { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
.x { width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--line); background: var(--surface); display: flex; align-items: center; justify-content: center; flex: 0 0 auto; color: var(--fg); font-size: 18px; font-weight: 700; }
.opt { min-height: 54px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); display: flex; align-items: center; gap: 12px; padding: 0 14px; text-align: left; width: 100%; }
.opt[aria-checked="true"] { border-color: var(--gold); }
.radio { width: 20px; height: 20px; border-radius: 10px; border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
.opt[aria-checked="true"] .radio { border-color: var(--gold); }
.opt[aria-checked="true"] .radio::after { content: ""; width: 10px; height: 10px; border-radius: 5px; background: var(--gold); }
label.f { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: var(--fg-2); }
.input { min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); padding: 0 14px; color: var(--fg); font-size: 15px; width: 100%; box-sizing: border-box; }
.search { display: flex; align-items: center; gap: 10px; min-height: 46px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); padding: 0 14px; }
.search input { flex: 1 1 auto; min-width: 0; background: transparent; border: none; outline: none; color: var(--fg); font-size: 15px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom, 0px)); z-index: 30; width: max-content; max-width: min(400px, calc(100% - 32px)); background: var(--fg); color: var(--on-light); font-weight: 700; font-size: 14px; border-radius: 14px; padding: 12px 16px; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
.welcome { min-height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 22px; padding-block: 28px 36px; padding-left: max(22px, env(safe-area-inset-left, 0px)); padding-right: max(22px, env(safe-area-inset-right, 0px)); }
.cover { position: relative; border-radius: 22px; overflow: hidden; border: 1px solid var(--gold-line); aspect-ratio: 16 / 10; max-width: 100%; background: var(--surface); }
.cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(7,7,7,0) 35%, rgba(7,7,7,.92)); }
.cover .in { position: absolute; left: 18px; right: 18px; bottom: 16px; z-index: 1; display: flex; flex-direction: column; gap: 6px; }
.hero { font-family: var(--logo); font-weight: 700; font-size: 44px; line-height: .95; letter-spacing: .05em; margin: 0; text-transform: uppercase; background: linear-gradient(180deg, var(--gold-2), var(--gold) 55%, var(--gold-deep)); -webkit-background-clip: text; background-clip: text; color: var(--gold); -webkit-text-fill-color: transparent; }
.disc { font-size: 11px; letter-spacing: .26em; color: var(--fg-2); text-transform: uppercase; font-weight: 700; }
.rule { display: flex; align-items: center; gap: 10px; color: var(--gold); font-size: 11px; letter-spacing: .3em; text-transform: uppercase; font-weight: 800; }
.rule::before, .rule::after { content: ""; height: 1px; flex: 1 1 auto; background: var(--gold-line); }
.rolecard { width: 100%; text-align: left; border-radius: 18px; border: 1px solid var(--line); background: var(--surface); padding: 14px 16px; display: flex; align-items: center; gap: 14px; color: var(--fg); }
.rolecard .ic { width: 46px; height: 46px; border-radius: 14px; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; background: var(--gold-bg); border: 1px solid var(--gold-line); }
.zones { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 4px; scrollbar-width: none; }
.zones::-webkit-scrollbar { display: none; }
.zone { flex: 0 0 76%; scroll-snap-align: start; border-radius: 16px; overflow: hidden; border: 1px solid var(--line); background: var(--surface); }
.zone img { width: 100%; height: 118px; object-fit: cover; display: block; }
.zone div { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 2px; }
.menu-item { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; }
.step { display: flex; align-items: center; gap: 4px; }
.step button { width: 38px; height: 38px; border-radius: 19px; border: 1px solid var(--line); background: transparent; color: var(--fg); font-size: 18px; font-weight: 800; }
.step b { min-width: 22px; text-align: center; font-variant-numeric: tabular-nums; }
.cartbar { position: sticky; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 4; }
.qr { width: 216px; height: 216px; max-width: 100%; background: #fff; padding: 12px; border-radius: 12px; }
.pass { background: linear-gradient(160deg, #1C1810, #0E0D0B); border: 1px solid var(--gold-line); color: var(--fg); border-radius: 22px; padding: 22px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.demo { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border: 1px dashed var(--line); border-radius: 8px; padding: 2px 6px; }
.empty { border: 1px dashed var(--line); border-radius: 16px; padding: 18px; color: var(--muted); font-size: 14px; text-align: center; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
</style>

  function closeBtn(type) { return '<button ' + (type ? 'type="button" ' : "") + 'class="x" data-a="close" aria-label="Sluiten">' + ic("x", 18) + "</button>"; }

          }).join("") + "</div>" +

        '<button class="btn accent big" type="submit">Lid toevoegen</button></form>';

  // ---------- Render ----------
  var root = document.getElementById("root");
  function render() {
    var focusId = document.activeElement && document.activeElement.id;
    var selStart = focusId === "q" ? document.activeElement.selectionStart : null;
    if (!S.role) { root.innerHTML = '<div class="app">' + vWelcome() + "</div>" + vSheet(); return; }
    var r = ROLES[S.role], t = curTab(), body = "";
    if (S.role === "lid") body = { home: vLidHome, book: vLidBook, lounge: vLidLounge, pay: vLidPay, pass: vLidPass }[t]();
    if (S.role === "coach") body = { today: vCoachToday, att: vCoachAtt, members: vCoachMembers }[t]();
    if (S.role === "admin") body = { dash: vAdminDash, members: vAdminMembers, pay: vAdminPay, roster: vAdminRoster }[t]();
    root.innerHTML = '<div class="app"><header class="top"><div class="brand"><div class="logo">The Arena</div><div class="sub">Athletic club</div></div>' +
      '<button class="rolebtn" data-a="openRoles" aria-label="Rol wisselen, nu ' + r.label + '"><span class="av">' + ini(r.who) + "</span>" + r.label + ic("down", 14, "currentColor", 2.5) + "</button></header>" +
      "<main>" + body + "</main>" +
      '<nav class="tabs" aria-label="Hoofdmenu" style="grid-template-columns:repeat(' + r.tabs.length + ',minmax(0,1fr))">' + r.tabs.map(function (x) {
        return '<button class="tab" data-a="tab" data-tab="' + x[0] + '"' + (x[0] === t ? ' aria-current="page"' : "") + ">" + ic(x[2]) + x[1] + "</button>";
      }).join("") + "</nav></div>" + vSheet() + (UI.toast ? '<div class="toast" role="status">' + esc(UI.toast) + "</div>" : "");
    if (focusId) { var el = document.getElementById(focusId); if (el) { el.focus(); if (selStart != null && el.setSelectionRange) try { el.setSelectionRange(selStart, selStart); } catch (e) {} } }
  }
  function commit() { save(); render(); }

  // ---------- Acties ----------
  var A = {
    pickRole: function (d) { S.role = d.role; UI.sheet = null; S.query = ""; commit(); window.scrollTo(0, 0); },
    openRoles: function () { UI.sheet = { kind: "roles" }; render(); },
    close: function () { UI.sheet = null; render(); },
    scrim: function (d, e) { if (e.target.classList.contains("scrim")) { UI.sheet = null; render(); } },
    reset: function () { var role = S.role; S = fresh(); S.role = role; UI.sheet = null; commit(); toast("Demo staat terug op de beginsituatie"); },
    tab: function (d) { S.tab[S.role] = d.tab; S.query = ""; commit(); window.scrollTo(0, 0); },
    setDay: function (d) { S.day = +d.i; commit(); },
    setRosterDay: function (d) { S.rosterDay = +d.i; commit(); },
    typeFilter: function (d) { S.typeFilter = d.v || null; commit(); },
    quickBook: function (d) { S.typeFilter = d.type; S.tab.lid = "book"; commit(); window.scrollTo(0, 0); },
    book: function (d) {
      var s = findSession(d.id); if (!s) return;
      if (!s.paid) { S.myBookings[s.id] = true; log(ME.first + " boekte " + s.title + " (" + DAYS_NL[s.date.getDay()] + " " + s.time + ")", TYPES[s.type].c); commit(); toast("Geboekt: " + s.title + ", " + DAYS_NL[s.date.getDay()] + " " + s.time); return; }
      UI.sheet = { kind: "pay", session: s.id, title: s.title, sub: dayLabel(s.date) + " · " + s.time + " · " + s.coach, price: s.priceVal, allowCredit: s.isIce, type: s.type };
      render();
    },
    cancelMine: function (d) { var s = findSession(d.id); delete S.myBookings[d.id]; commit(); toast("Boeking geannuleerd" + (s ? ": " + s.title : "")); },
    buy: function (d) {
      var p = PRODUCTS.filter(function (x) { return x.id === d.id; })[0]; if (!p) return;
      UI.sheet = { kind: "pay", product: p.id, title: p.title, sub: p.sub, price: p.price, credits: p.credits || 0 };
      render();
    },
    cartInc: function (d) { S.cart[d.id] = (S.cart[d.id] || 0) + 1; commit(); },
    cartDec: function (d) { S.cart[d.id] = Math.max(0, (S.cart[d.id] || 0) - 1); commit(); },
    checkoutCart: function () {
      var items = cartItems(); if (!items.length) return;
      var summary = items.map(function (m) { return m.qty + "× " + m.name; }).join(", ");
      UI.sheet = { kind: "pay", order: true, title: "Shake bar", sub: summary, price: cartTotal(), summary: summary };
      render();
    },
    method: function (d) { UI.sheet.method = d.v; render(); },
    confirmPay: function () {
      var sh = UI.sheet; if (!sh) return;
      var credit = sh.method === "credit";
      if (sh.session) S.myBookings[sh.session] = true;
      if (credit) { S.credits -= 1; log(ME.first + " boekte " + sh.title + " met een beurt", "var(--rec)"); }
      else {
        S.payments.unshift({ id: "p" + Date.now(), who: ME.name, what: sh.title, method: sh.method, date: "vandaag " + nowTime(), amount: sh.price, status: "betaald", kind: sh.order ? "lounge" : "club" });
        if (sh.credits) S.credits += sh.credits;
        log(ME.first + " betaalde " + eur(sh.price) + (sh.order ? " aan de shake bar" : " voor " + sh.title), sh.order ? "var(--gold)" : (sh.type ? TYPES[sh.type].c : "var(--ok)"));
      }
      if (sh.order) { sh.ready = nowTime(10); S.orders.unshift({ who: ME.first, summary: sh.summary, ready: sh.ready }); S.cart = {}; }
      sh.done = true; commit();
    },
    invoice: function () { toast("In de echte app opent hier de factuur als PDF"); },
    selfCheckin: function () { S.inClub += 1; log(ME.first + " checkte in aan de poort", "var(--ok)"); commit(); toast("Poort open. Welkom in The Arena, " + ME.first); },
    openAtt: function (d) { S.coachSess = d.id; S.tab.coach = "att"; commit(); window.scrollTo(0, 0); },
    toggleCheck: function (d) {
      S.checkins[d.sid] = S.checkins[d.sid] || {};
      S.checkins[d.sid][d.mid] = !S.checkins[d.sid][d.mid];
      commit();
    },
    scan: function (d) {
      var s = findSession(d.id); if (!s) return;
      var ck = S.checkins[s.id] = S.checkins[s.id] || {};
      var nxt = s.roster.filter(function (id) { return !ck[id]; })[0];
      if (!nxt) { toast("Iedereen is al ingecheckt"); return; }
      ck[nxt] = true;
      var m = memberById(nxt);
      log(m.name.split(" ")[0] + " checkte in bij " + s.title, "var(--ok)");
      commit();
      toast(m.name + " ingecheckt" + (m.status === "open" ? ". Let op: betaling open" : ""));
    },
    memberFilter: function (d) { S.memberFilter = d.v; commit(); },
    payFilter: function (d) { S.payFilter = d.v; commit(); },
    goPay: function (d) { S.payFilter = d.f; S.tab.admin = "pay"; commit(); window.scrollTo(0, 0); },
    remind: function (d) { var m = memberById(d.id); S.reminded[d.id] = true; log("Betaalherinnering naar " + m.name, "var(--warn)"); commit(); toast("Herinnering verstuurd naar " + m.name + " (demo)"); },
    markPaid: function (d) {
      S.payments.forEach(function (p) {
        if (p.id === d.id) {
          p.status = "betaald";
          S.paidOverride[p.who] = true;
          log(p.who + " is in orde: " + eur(p.amount), "var(--ok)");
        }
      });
      commit(); toast("Gemarkeerd als betaald");
    },
    export: function () { toast("In de echte app download je hier een CSV voor de boekhouder"); },
    newMember: function () { UI.sheet = { kind: "member" }; render(); setTimeout(function () { var el = document.getElementById("mName"); if (el) el.focus(); }, 50); },
    newSession: function () { UI.sheet = { kind: "session" }; render(); },
    cap: function (d) { var s = findSession(d.id); if (!s) return; var v = Math.max(Math.max(1, s.roster.length), Math.min(40, s.cap + (+d.d))); S.caps[s.id] = v; commit(); },
    toggleCancel: function (d) {
      var s = findSession(d.id); if (!s) return;
      S.cancelled[d.id] = !S.cancelled[d.id];
      log((S.cancelled[d.id] ? "Geannuleerd: " : "Hersteld: ") + s.title + " (" + DAYS_NL[s.date.getDay()] + " " + s.time + ")", S.cancelled[d.id] ? "var(--bad)" : "var(--ok)");
      commit();
      toast(S.cancelled[d.id] ? s.roster.length + " ingeschreven leden krijgen een melding (demo)" : "Les hersteld");
    }
  };

  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-a]"); if (!el) return;
    var fn = A[el.getAttribute("data-a")]; if (!fn) return;
    fn(el.dataset, e);
  });
  document.addEventListener("input", function (e) {
    if (e.target.id !== "q") return;
    S.query = e.target.value;
    var box = document.getElementById("mlist"); if (!box) return;
    box.innerHTML = S.role === "admin" ? (memberRows(adminMemberList(), true) || '<div class="empty">Geen leden in deze selectie.</div>') : (memberRows(filteredMembers(), false) || '<div class="empty">Geen lid gevonden.</div>');
  });
  document.addEventListener("submit", function (e) {
    e.preventDefault();
    if (e.target.id === "fMember") {
      var name = document.getElementById("mName").value.trim(); if (!name) return;
      var plan = document.getElementById("mPlan").value;
      var openPay = document.getElementById("mOpen").checked;
      S.extraMembers.unshift({ id: "x" + Date.now(), name: name, plan: plan, status: plan === "Proefles" ? "proef" : (openPay ? "open" : "actief") });
      var amount = { "All-in maand": PRICES.abo, "All-in jaar": PRICES.abo * 10, "10-beurtenkaart": PRICES.kaart10, "Jeugd kickboxing": 45, "Recovery 5-beurten": PRICES.rec5, "Proefles": 0 }[plan];
      if (amount) S.payments.unshift({ id: "p" + Date.now(), who: name, what: plan, method: openPay ? "Betaallink verstuurd" : "Betaald aan de receptie", date: "vandaag " + nowTime(), amount: amount, status: openPay ? "open" : "betaald", kind: "club" });
      log(name + " is nieuw lid (" + plan + ")", "var(--gold)");
      UI.sheet = null; S.memberFilter = "alle"; commit(); toast(name + " toegevoegd" + (openPay && amount ? ", betaallink verstuurd (demo)" : ""));
    }
    if (e.target.id === "fSession") {
      var type = document.getElementById("sType").value;
      var title = document.getElementById("sTitle").value.trim() || TYPES[type].label;
      var time = document.getElementById("sTime").value || "18:00";
      var cap = Math.max(1, Math.min(40, parseInt(document.getElementById("sCap").value, 10) || 10));
      var coach = document.getElementById("sCoach").value;
      S.extraSessions.push({ id: "e" + Date.now(), date: keyOf(WEEK[S.rosterDay]), time: time, type: type, title: title, coach: coach, cap: cap, fill: 0 });
      log("Nieuwe les: " + title + " (" + DAYS_NL[WEEK[S.rosterDay].getDay()] + " " + time + ")", TYPES[type].c);
      UI.sheet = null; commit(); toast("Les toegevoegd, leden kunnen meteen boeken");
    }
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && UI.sheet) { UI.sheet = null; render(); } });

  render();
})();
</script>

</body>
</html>
